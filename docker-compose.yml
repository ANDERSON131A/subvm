services:
  debian:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-debian:latest}
        SSH_PORT: ${SSH_PORT:-2222}
        ROOT_PASS: ${ROOT_PASS:-debian123}
        VM_PASS: ${VM_PASS:-vm123}
    container_name: ${VM_NAME:-debian-vm}
    network_mode: host
    restart: unless-stopped
    volumes:
      - debian-home:/home/vm
      - debian-root:/root

volumes:
  debian-home:
  debian-root:
